<div>
  <table class="table-fixed border-collapse" style="width: 80%">
    <thead>
      <tr class="border-b border-b-gray-400">
        <th class="text-center" style="width: 10%">Id</th>
        <th class="text-center" style="width: 10%">Фото</th>
        <th class="text-center" style="width: 40%">Назва</th>
        <th class="text-center" style="width: 8%">Рейтинг</th>
        <th class="text-center" style="width: 8%">Ціна</th>
        <th class="text-center" style="width: 19%">Автор</th>
        <th class="text-center" style="width: 5%">
          <a routerLink="create">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 hover:cursor-pointer hover:bg-gray-200 rounded-3xl"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </a>
        </th>
      </tr>
    </thead>
    <tbody>
      @for (book of books(); track book.id) {
        <tr class="border-b border-b-gray-400">
          <td class="text-center">{{ book.id }}</td>
          <td class="flex justify-center py-1">
            <img
              (error)="imageErrorHandle($event)"
              style="height: 75px; height: 75px; object-fit: contain"
              alt="{{ book.title }}"
              src="{{ book.image ? book.image : `/images/bookDefault.png` }}"
            />
          </td>
          <td class="text-center">{{ book.title }}</td>
          <td class="text-center">{{ book.rating }}</td>
          <td class="text-center">{{ book.price }}</td>
          <td class="text-center">{{ book.author ? book.author.name : '' }}</td>
          <td class="text-center">
            <a routerLink="update/{{book.id}}">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6 my-1 text-green-700 hover:cursor-pointer hover:bg-gray-200"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
                />
              </svg>
            </a>
            <svg
              (click)="deleteBook(book.id)"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 text-red-700 hover:cursor-pointer hover:bg-gray-200 rounded-3xl"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
