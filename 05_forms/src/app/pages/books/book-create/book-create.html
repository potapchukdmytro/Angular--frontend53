<div>
  <h1 class="text-center text-5xl my-5 font-medium">Нова книга</h1>
</div>
<form
  [formGroup]="createForm"
  (ngSubmit)="handleSubmit()"
  class="w-1/3 m-auto p-10 border-2 rounded-2xl border-gray-300"
>
  <!-- title -->
  <div class="sm:col-span-4">
    <label for="title" class="block text-sm/6 font-medium text-black">Назва</label>
    <div class="mt-2">
      <input
        id="title"
        type="text"
        name="title"
        formControlName="title"
        autocomplete="title"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-700 focus:outline-2 focus:-outline-offset-2 focus:outline-gray-600 sm:text-sm/6"
      />
    </div>
  </div>

  <!-- description -->
  <div class="sm:col-span-4 mt-3">
    <label for="description" class="block text-sm/6 font-medium text-black">Опис</label>
    <div class="mt-2">
      <textarea
        id="description"
        name="description"
        formControlName="description"
        rows="3"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-700 focus:outline-2 focus:-outline-offset-2 focus:outline-gray-600 sm:text-sm/6"
      ></textarea>
    </div>
  </div>

  <!-- image -->
  <div class="sm:col-span-4 mt-3">
    <label for="image" class="block text-sm/6 font-medium text-black">Обкладинка</label>
    <div class="mt-2">
      <input
        id="image"
        type="text"
        name="image"
        formControlName="image"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
      />
    </div>
  </div>

  <!-- rating -->
  <div class="sm:col-span-4 mt-3">
    <label for="rating" class="block text-sm/6 font-medium text-black">Рейтинг</label>
    <div class="mt-2">
      <input
        id="rating"
        type="number"
        name="rating"
        formControlName="rating"
        min="0"
        max="5"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
      />
    </div>
  </div>

  <!-- price -->
  <div class="sm:col-span-4 mt-3">
    <label for="price" class="block text-sm/6 font-medium text-black">Ціна</label>
    <div class="mt-2">
      <input
        id="price"
        type="number"
        name="price"
        formControlName="price"
        min="0"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
      />
    </div>
  </div>

  <!-- numberOfPages -->
  <div class="sm:col-span-4 mt-3">
    <label for="numberOfPages" class="block text-sm/6 font-medium text-black">К-сть сторінок</label>
    <div class="mt-2">
      <input
        id="numberOfPages"
        type="number"
        name="numberOfPages"
        formControlName="numberOfPages"
        min="0"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
      />
    </div>
  </div>

  <!-- publishDate -->
  <div class="sm:col-span-4 mt-3">
    <label for="publishDate" class="block text-sm/6 font-medium text-black">Рік публікації </label>
    <div class="mt-2">
      <input
        id="publishDate"
        type="number"
        name="publishDate"
        formControlName="publishDate"
        min="0"
        class="block w-full rounded-md bg-black/10 px-3 py-1.5 text-base text-black outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
      />
    </div>
  </div>

  <div class="text-center mt-5">
    <input
      class="font-medium bg-slate-400 text-black px-4 py-2 rounded-2xl w-1/3 hover:bg-slate-300 hover:cursor-pointer"
      type="submit"
      value="Додати"
    />
  </div>
</form>
