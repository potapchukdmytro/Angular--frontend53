<div
  class="min-h-screen bg-top bg-repeat-y"
  style="background-image: url('https://picsum.photos/1920/1080')"
>
  @if (usersService.user()) {
    <!-- Overlay -->
    <div class="min-h-screen bg-slate-900/10">
      <!-- Main -->
      <main class="flex items-center justify-center px-4 py-12">
        <div
          style="max-width: 950px"
          class="grid w-full grid-cols-1 overflow-hidden rounded-2xl bg-white shadow-2xl md:grid-cols-[280px_1fr]"
        >
          <!-- Left sidebar -->
          <aside class="border-b border-slate-200 p-8 md:border-b-0 md:border-r">
            <!-- Avatar -->
            <div class="flex flex-col items-center">
              <div class="relative">
                <img
                  [src]="usersService.user()!.image ? usersService.imagesUrl + usersService.user()!.image : '/images/profileAvatarDefault.png'"
                  [alt]="usersService.user()!.userName"
                  class="h-40 w-40 rounded-full object-cover shadow-md"
                />

                <label
                  for="avatar"
                  class="hover:cursor-pointer absolute bottom-2 right-2 flex h-10 w-10 items-center justify-center rounded-full bg-white shadow-md transition hover:bg-slate-100"
                >
                  <svg
                    class="h-5 w-5 text-slate-700"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"
                    />
                    <circle cx="12" cy="13" r="3" />
                  </svg>
                </label>
                <input (change)="imageSelect($event)" id="avatar" type="file" accept="image/*" hidden/>
              </div>

              <h1 class="mt-5 text-2xl font-bold">{{ usersService.user()!.userName }}</h1>

              <p class="mt-1 text-sm text-slate-500">{{ usersService.user()!.email }}</p>
            </div>

            <!-- Sidebar navigation -->
            <nav class="mt-10 space-y-2">
              <!-- Active -->
              <a
                routerLink="/profile"
                routerLinkActive="bg-blue-50 font-medium !text-blue-600"
                [routerLinkActiveOptions]="{exact: true}"
                class="flex items-center gap-3 rounded-lg px-4 py-3 text-slate-600 transition hover:bg-slate-100"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M20 21a8 8 0 0 0-16 0" />
                  <circle cx="12" cy="7" r="4" />
                </svg>

                Мій профіль
              </a>

              <a
                routerLink="favorites"
                routerLinkActive="bg-blue-50 font-medium !text-blue-600"
                class="flex items-center gap-3 rounded-lg px-4 py-3 text-slate-600 transition hover:bg-slate-100"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"
                  />
                </svg>

                Улюблене
              </a>

              <a
                routerLink="reviewed"
                routerLinkActive="bg-blue-50 font-medium !text-blue-600"
                class="flex items-center gap-3 rounded-lg px-4 py-3 text-slate-600 transition hover:bg-slate-100"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                </svg>

                Переглянуті
              </a>

              <a
                routerLink="settings"
                routerLinkActive="bg-blue-50 font-medium !text-blue-600"
                class="flex items-center gap-3 rounded-lg px-4 py-3 text-slate-600 transition hover:bg-slate-100"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20h-3v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2.1-2.1.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H5v-3h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h3v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v3h-.2a1.7 1.7 0 0 0-1.4.5z"
                  />
                </svg>

                Налаштування
              </a>

              <button
                (click)="logoutHandler()"
                class="flex w-full items-center gap-3 rounded-lg px-4 py-3 text-left text-red-500 transition hover:bg-red-50"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M10 17l5-5-5-5" />
                  <path d="M15 12H3" />
                  <path d="M21 19V5a2 2 0 0 0-2-2h-6" />
                </svg>

                Вийти
              </button>
            </nav>
          </aside>

          <!-- Profile content -->
          <section class="p-8 md:p-10">
            <!-- Title -->
            <router-outlet [routerOutletData]="usersService.user()"></router-outlet>
          </section>
        </div>
      </main>
    </div>
  }
</div>
