<div class="flex items-center justify-between">
  <h2 class="text-2xl font-bold">Особиста інформація</h2>

  <button
    class="flex items-center gap-2 rounded-lg bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-200"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 20h9" />
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z" />
    </svg>

    Редагувати
  </button>
</div>

<!-- Info list -->
<div class="mt-6 divide-y divide-slate-200">
  <!-- Name -->
  <div class="grid grid-cols-[180px_1fr] items-center py-5">
    <div class="flex items-center gap-3 text-slate-500">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21a8 8 0 0 0-16 0" />
        <circle cx="12" cy="7" r="4" />
      </svg>

      Ім'я
    </div>

    <span class="font-medium"> {{ user().userName }} </span>
  </div>

  <!-- Email -->
  <div class="grid grid-cols-[180px_1fr] items-center py-5">
    <div class="flex items-center gap-3 text-slate-500">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </svg>

      Email
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <span class="font-medium"> {{ user().email }} </span>

      @if (user().emailConfirmed) {
        <span
          class="inline-flex items-center gap-1 rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="m8 12 2.5 2.5L16 9" />
          </svg>

          Підтверджено
        </span>
      } @else {
        <span
          (click)="sendEmailConfirm()"
          class="hover:cursor-pointer inline-flex items-center gap-1 rounded-full bg-red-100 px-3 py-1 text-xs font-medium text-red-700"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M9 9l6 6M15 9l-6 6" />
          </svg>

          Підтвердити
        </span>
      }
    </div>
  </div>

  <!-- Birthday -->
  <div class="grid grid-cols-[180px_1fr] items-center py-5">
    <div class="flex items-center gap-3 text-slate-500">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 11h18" />
      </svg>

      Дата народження
    </div>

    <span class="font-medium"> 15 травня 1998 </span>
  </div>

  <!-- Country -->
  <div class="grid grid-cols-[180px_1fr] items-center py-5">
    <div class="flex items-center gap-3 text-slate-500">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z" />
        <circle cx="12" cy="10" r="2" />
      </svg>

      Країна
    </div>

    <span class="font-medium"> Україна </span>
  </div>
</div>

<!-- About -->
<div class="mt-10">
  <h3 class="text-xl font-bold">Про себе</h3>

  <div class="mt-4 flex items-start justify-between gap-4 rounded-lg bg-slate-100 p-5">
    <p class="leading-7 text-slate-600">
      Люблю фільми, музику та хороші книги. Завжди відкритий до нових історій!
    </p>

    <button class="shrink-0 text-slate-500 transition hover:text-blue-600">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z" />
      </svg>
    </button>
  </div>
</div>
