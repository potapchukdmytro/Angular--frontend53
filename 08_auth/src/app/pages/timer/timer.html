<div class="flex justify-center mt-4 flex-col items-center">
  <div class="text-4xl font-bold">
    {{ stopwatch.time() }}
  </div>
  <div class="mt-3">
    <button
      (click)="stopwatch.start()"
      class="bg-teal-600 px-4 py-2 rounded-xl mx-1 text-white hover:bg-teal-700 hover:cursor-pointer"
    >
      Старт
    </button>
    <button
      (click)="stopwatch.stop()"
      class="bg-amber-600 px-4 py-2 rounded-xl mx-1 text-white hover:bg-amber-700 hover:cursor-pointer"
    >
      Стоп
    </button>
    <button
      (click)="stopwatch.reset()"
      class="bg-rose-600 px-4 py-2 rounded-xl mx-1 text-white hover:bg-rose-700 hover:cursor-pointer"
    >
      Скинути
    </button>
  </div>
</div>
