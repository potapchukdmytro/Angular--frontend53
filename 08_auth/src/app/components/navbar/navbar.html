<div class="flex p-5 bg-slate-700 text-white">
  <!-- logo -->
  <div class="flex-1"></div>

  <!-- navigation -->
  <div class="flex-3 flex justify-evenly items-center">
    <div>
      <a routerLink="/">Головна</a>
    </div>
    <div>
      <a routerLink="/movie">Фільм</a>
    </div>
    <div>
      <a routerLink="/band">Гурт</a>
    </div>
    <div>
      <a routerLink="/books">Книги</a>
    </div>
    <div>
      <a routerLink="/dashboard">Панель керування</a>
    </div>
  </div>

  <div class="flex-2 flex justify-end">
    <div class="flex-1"></div>
    <div class="flex-1 flex justify-end">
      @if (authService.isAuth()) {
        <div class="mx-2">
          <a routerLink="/profile">Профіль</a>
        </div>
        <div class="mx-2">
          <a class="hover:cursor-pointer" (click)="authService.logout()">Вийти</a>
        </div>
      } @else {
        <div class="mx-2">
          <a routerLink="/login">Увійти</a>
        </div>
        <div class="mx-2">
          <a routerLink="/register">Зареєструватися</a>
        </div>
      }
    </div>
  </div>
</div>
